      <div style="font-size:12.5px; color:#75807A;">Agar yeh message ghayab nahi hota, to internet connection check karein (yeh app React/Babel/Icons ko internet se load karta hai).</div>

<script>
  // Diagnostic layer: runs with plain JS (no Babel/network dependency) so that
  // if anything downstream fails, the user sees *why* instead of a blank page.
  window.addEventListener("error", function (e) {
    showBootError((e && e.message) || "Unknown script error", e.filename, e.lineno);
  });
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e && e.reason ? (e.reason.message || String(e.reason)) : "Unknown promise rejection";
    showBootError(reason);
  });
  function showBootError(msg, file, line) {
    var el = document.getElementById("boot-fallback");
    if (!el) return;
    el.innerHTML =
      '<div style="font-size:15px; font-weight:700; color:#B03434; margin-bottom:8px;">App load nahi ho saka</div>' +
      '<div style="font-size:12.5px; color:#444; word-break:break-word;">' + String(msg) + (file ? ' <br/><span style="color:#999">(' + file + (line ? ":" + line : "") + ')</span>' : '') + '</div>' +
      '<div style="font-size:11.5px; color:#999; margin-top:10px;">Common wajah: internet connection na hona, ya CDN (unpkg/esm.sh/fonts) block hona. Dobara internet ke sath try karein.</div>';
  }
  // If nothing has replaced the fallback within 12s, assume CDN scripts failed to load
  // (most common cause: no internet, or unpkg.com / esm.sh blocked on this network).
  setTimeout(function () {
    var el = document.getElementById("boot-fallback");
    if (el && document.getElementById("root").children.length === 1) {
      showBootError("Timeout: React/Babel/Icons CDN se load nahi ho paye (12 second guzar gaye).");
    }
  }, 12000);
</script>

const uid = () => Math.random().toString(36).slice(2, 10);
const timeAgo = (ts) => {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "abhi";
  if (s < 3600) return `${Math.floor(s / 60)}m pehle`;
  if (s < 86400) return `${Math.floor(s / 3600)}h pehle`;
  return `${Math.floor(s / 86400)}d pehle`;
};

async function getShared(key, fallback) {
  try {
    const r = await window.storage.get(key, true);
    return r && r.value ? JSON.parse(r.value) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function setShared(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), true);
  } catch (e) { /* best effort */ }
}
async function getPersonal(key, fallback) {
  try {
    const r = await window.storage.get(key, false);
    return r && r.value ? JSON.parse(r.value) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function setPersonal(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
  } catch (e) { /* best effort */ }
}

const DEFAULT_CATEGORIES = ["Aqeedah", "Namaz", "Roza", "Zakat", "Hajj", "Nikah", "Muamlaat", "Ikhtilafi Masail"];

function useCountUp(target, duration = 700) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let start = null;
    let raf;
    const step = (ts) => {
      if (start === null) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      setVal(Math.floor(p * target));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return val;
}

function avgRating(q) {
  if (!q || !q.ratingCount) return 0;
  return q.ratingSum / q.ratingCount;
}

function shareText(q) {
  const text = `${q.question}\n\n${q.answer ? "Jawab: " + q.answer + "\n\n" : ""}— ${q.muftiName || "IlmLive"} · IlmLive App`;
  if (navigator.share) {
    navigator.share({ title: "IlmLive Masla", text }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text);
  }
}

/* ============================== theme ============================== */

const LIGHT = {

const useTheme = () => useContext(ThemeCtx);

function inputStyleFor(t) {

    gold: { bg: "#F8EFD9", text: "#8A6A1E" },
    red: { bg: "#FBE7E7", text: "#B03434" },
    purple: { bg: "#EFEAF8", text: "#5B3F91" },

function LivePulse() {

}

function PrimaryButton({ children, onClick, style, disabled, icon }) {

    <button

      disabled={disabled}
      style={{
        display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 6,
        background: disabled ? "#B7C9C3" : "linear-gradient(135deg,#0B6E55,#0E8C6C)", color: "#fff",

function IconButton({ children, onClick, active, style, title }) {

function Skeleton({ h = 70 }) {

}

function StarRating({ value, count, interactive, onRate, size = 14 }) {
  const [hover, setHover] = useState(0);
  const display = hover || Math.round(value);
  return (
    <div style={{ display: "inline-flex", alignItems: "center", gap: 2 }}>
      {[1, 2, 3, 4, 5].map((n) => (
        <span
          key={n}
          onMouseEnter={() => interactive && setHover(n)}
          onMouseLeave={() => interactive && setHover(0)}
          onClick={() => interactive && onRate && onRate(n)}
          style={{ cursor: interactive ? "pointer" : "default", lineHeight: 0 }}
        >
          <Star size={size} color={n <= display ? "#C89B3C" : "#D9D6C9"} fill={n <= display ? "#C89B3C" : "none"} />
        </span>
      ))}
      {typeof count === "number" && count > 0 && <span style={{ fontSize: 11, color: "#9AA39D", marginLeft: 3 }}>({count})</span>}
    </div>
  );
}

/* ============================== Notification Center ============================== */

function NotificationBell({ items }) {
  const t = useTheme();
  const [open, setOpen] = useState(false);
  const [seenCount, setSeenCount] = useState(0);
  const unread = Math.max(0, items.length - seenCount);
  return (
    <div style={{ position: "relative" }}>
      <IconButton onClick={() => { setOpen((o) => !o); if (!open) setSeenCount(items.length); }} title="Notifications">
        <Bell size={16} />
      </IconButton>
      {unread > 0 && (
        <span style={{ position: "absolute", top: -3, right: -3, background: "#D64545", color: "#fff", fontSize: 9.5, fontWeight: 700, borderRadius: 999, minWidth: 16, height: 16, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 3px" }}>

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "4px 6px 8px" }}>
            <span style={{ fontWeight: 700, fontSize: 13, color: t.text }}>Notifications</span>
            <button onClick={() => setOpen(false)} style={{ background: "none", border: "none", cursor: "pointer", color: t.sub, display: "flex" }}><X size={15} /></button>
          </div>
          {items.length === 0 && <p style={{ fontSize: 12.5, color: t.sub, padding: "10px 6px" }}>Koi notification nahi.</p>}

/* ============================== Login / role select ============================== */

function LoginScreen({ onEnter }) {
  const [step, setStep] = useState("pick");
  const [role, setRole] = useState(null);
  const [name, setName] = useState("");
  const [bio, setBio] = useState("");
  const [passcode, setPasscode] = useState("");
  const [error, setError] = useState("");

  const ROLES = [
    { id: "user", label: "User", desc: "Sawal poochein, live majlis join karein", icon: <User size={22} /> },
    { id: "scholar", label: "Aalim / Mufti Panel", desc: "Masail ka jawab dein, live munazra karein", icon: <BadgeCheck size={22} /> },
    { id: "admin", label: "Admin Panel", desc: "Poora management system", icon: <ShieldCheck size={22} /> },
  ];

  const pick = (r) => { setRole(r); setError(""); setStep(r === "user" ? "name" : r === "scholar" ? "scholar" : "admin"); };

  const submit = () => {
    if (role === "user") {
      if (!name.trim()) return setError("Apna naam likhein.");
      onEnter({ role: "user", name: name.trim() });
    } else if (role === "scholar") {
      if (!name.trim()) return setError("Apna naam likhein.");
      onEnter({ role: "scholar", name: name.trim(), bio: bio.trim() });
    } else if (role === "admin") {
      if (passcode !== "786786") return setError("Ghalat passcode. Demo passcode: 786786");
      onEnter({ role: "admin", name: "Admin" });
    }
  };

  return (
    <div style={{ minHeight: "100vh", background: "linear-gradient(180deg,#0B6E55 0%,#0A5B47 45%,#0F221D 100%)", display: "flex", flexDirection: "column", padding: "40px 20px" }}>
      <div style={{ textAlign: "center", marginBottom: 30 }}>

      {step === "pick" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>

          {step === "scholar" && (
            <p style={{ fontSize: 12, color: "#8A6A1E", background: "#F8EFD9", padding: "8px 10px", borderRadius: 8, marginTop: 10 }}>

      )}

/* ============================== Live session room ============================== */

function LiveRoom({ session, refreshSession, onLeave, currentUser, isHost }) {
  const [text, setText] = useState("");
  const [reactions, setReactions] = useState([]);
  const scrollRef = useRef(null);

  useEffect(() => {
    const t = setInterval(() => refreshSession(session.id), 3000);
    return () => clearInterval(t);
  }, [session.id, refreshSession]);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [session.messages?.length]);

  const send = async () => {
    if (!text.trim()) return;
    const sessions = await getShared("sessions", []);
    const idx = sessions.findIndex((s) => s.id === session.id);
    if (idx === -1) return;
    sessions[idx].messages = [...(sessions[idx].messages || []), { id: uid(), user: currentUser, text: text.trim(), ts: Date.now(), pinned: false }];
    await setShared("sessions", sessions);
    setText("");
    refreshSession(session.id);
  };

  const pin = async (msgId) => {
    const sessions = await getShared("sessions", []);
    const idx = sessions.findIndex((s) => s.id === session.id);
    if (idx === -1) return;
    sessions[idx].messages = sessions[idx].messages.map((m) => ({ ...m, pinned: m.id === msgId }));
    await setShared("sessions", sessions);
    refreshSession(session.id);
  };

  const endSession = async () => {
    const sessions = await getShared("sessions", []);
    const idx = sessions.findIndex((s) => s.id === session.id);
    if (idx === -1) return;
    sessions[idx].status = "ended";
    await setShared("sessions", sessions);
    onLeave();
  };

  const react = (emoji) => {
    const id = uid();
    setReactions((r) => [...r, { id, emoji, left: 10 + Math.random() * 70 }]);
    setTimeout(() => setReactions((r) => r.filter((x) => x.id !== id)), 1800);
  };

  const copyLink = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(`IlmLive Live: "${session.title}" — abhi join karein!`);
  };

  const pinned = (session.messages || []).find((m) => m.pinned);

  return (
    <div style={{ position: "fixed", inset: 0, maxWidth: 480, margin: "0 auto", background: "#17221E", zIndex: 20, display: "flex", flexDirection: "column" }}>
      <div style={{ padding: "16px 16px 12px", background: "linear-gradient(180deg,#0F221D,#17221E)", borderBottom: "1px solid #26332D" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <button onClick={onLeave} style={{ background: "none", border: "none", color: "#CFE3DC", cursor: "pointer", padding: 0 }}><ArrowLeft size={18} /></button>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <button onClick={copyLink} style={{ background: "none", border: "none", color: "#CFE3DC", cursor: "pointer", padding: 0, display: "flex" }} title="Share session"><Share2 size={16} /></button>
            <LivePulse />
          </div>
        </div>
        <p style={{ fontFamily: "'Newsreader', serif", color: "#fff", fontSize: 17, margin: "4px 0 2px 0" }}>{session.title}</p>
        <div style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 12, color: "#9CB0A8" }}>
          <span>{session.type === "debate" ? <><Swords size={12} style={{ verticalAlign: -2 }} /> {session.host} vs {session.opponent}</> : <>Mikspeaker: {session.host}</>}</span>
          <span>· {session.viewers} dekh rahe hain</span>
        </div>
      </div>

      {pinned && (
        <div style={{ margin: "10px 14px 0", background: "#F8EFD9", borderRadius: 10, padding: "8px 12px", display: "flex", gap: 8 }}>
          <Star size={14} color="#8A6A1E" style={{ flexShrink: 0, marginTop: 2 }} />
          <p style={{ fontSize: 13, color: "#5A430F", margin: 0 }}><strong>{pinned.user}:</strong> {pinned.text}</p>
        </div>
      )}

      <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: "12px 14px" }}>
        {(session.messages || []).length === 0 && (
          <p style={{ textAlign: "center", color: "#75807A", fontSize: 13, marginTop: 30 }}>Abhi tak koi paigham nahi. Pehla sawal ya salam bhejein.</p>
        )}
        {(session.messages || []).map((m) => (
          <div key={m.id} style={{ marginBottom: 10, display: "flex", flexDirection: "column", alignItems: m.user === currentUser ? "flex-end" : "flex-start" }}>
            <div onClick={() => isHost && pin(m.id)} style={{ maxWidth: "80%", background: m.user === currentUser ? "#0B6E55" : "#232E29", color: "#fff", padding: "8px 12px", borderRadius: 14, fontSize: 13.5, cursor: isHost ? "pointer" : "default" }}>
              {m.user !== currentUser && <div style={{ fontSize: 10.5, color: "#8FBBAC", marginBottom: 2, fontWeight: 700 }}>{m.user}</div>}
              {m.text}
            </div>
          </div>
        ))}
      </div>

      <div style={{ position: "relative", height: 0 }}>
        {reactions.map((r) => (
          <span key={r.id} className="float-up" style={{ position: "absolute", bottom: 0, left: `${r.left}%`, fontSize: 22 }}>{r.emoji}</span>
        ))}
      </div>

      <div style={{ padding: 12, borderTop: "1px solid #26332D", display: "flex", gap: 8, alignItems: "center", background: "#17221E" }}>
        <div style={{ display: "flex", gap: 4 }}>
          {["❤️", "🤲", "👍"].map((e) => (
            <button key={e} onClick={() => react(e)} style={{ background: "#232E29", border: "none", borderRadius: 999, width: 34, height: 34, fontSize: 16, cursor: "pointer" }}>{e}</button>
          ))}
        </div>
        <input value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Paigham likhein…" style={{ flex: 1, background: "#232E29", border: "none", borderRadius: 999, padding: "10px 14px", color: "#fff", fontSize: 13.5 }} />
        <button onClick={send} style={{ width: 38, height: 38, borderRadius: 999, background: "#0B6E55", border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
          <Send size={16} color="#fff" />
        </button>
      </div>

      {isHost && (
        <div style={{ padding: "0 12px 12px" }}>
          <GhostButton onClick={endSession} icon={<Square size={13} />} style={{ width: "100%", justifyContent: "center", background: "#232E29", color: "#F0B4B4", border: "1px solid #3A2626" }}>
            Session Khatam Karein
          </GhostButton>
        </div>
      )}
    </div>
  );
}

/* ============================== Scholar Leaderboard ============================== */

function ScholarLeaderboard({ shared }) {
  const t = useTheme();
  const approved = shared.muftis.filter((m) => m.status === "approved");
  const withStats = approved.map((m) => {
    const theirQs = shared.questions.filter((q) => q.muftiName === m.name && q.status === "answered");
    const sum = theirQs.reduce((a, q) => a + (q.ratingSum || 0), 0);
    const cnt = theirQs.reduce((a, q) => a + (q.ratingCount || 0), 0);
    return { ...m, avg: cnt ? sum / cnt : 0, ratingCount: cnt };
  }).sort((a, b) => (b.avg - a.avg) || ((b.questionsAnswered || 0) - (a.questionsAnswered || 0)));

  const medalColor = ["#C89B3C", "#A9A9A9", "#B08D57"];

  return (
    <div>
      <SectionTitle icon={<Trophy size={15} />} text="Ulama Leaderboard" />
      <p style={{ fontSize: 12.5, color: t.sub, marginBottom: 14 }}>Users ki rating aur jawabaat ki bunyad par.</p>
      {withStats.length === 0 && <EmptyState icon={<Trophy size={26} />} text="Abhi koi approved scholar nahi." />}
      {withStats.map((m, i) => (
        <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 12, background: t.surface, border: `1px solid ${t.border}`, borderRadius: 12, padding: 12, marginBottom: 8 }}>
          <div style={{ width: 30, textAlign: "center", flexShrink: 0 }}>
            {i < 3 ? <Medal size={20} color={medalColor[i]} /> : <span style={{ fontSize: 13, color: t.sub2, fontWeight: 700 }}>{i + 1}</span>}
          </div>
          <div style={{ width: 40, height: 40, borderRadius: 999, background: "#F8EFD9", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'Newsreader', serif", fontSize: 16, color: "#8A6A1E", flexShrink: 0 }}>
            {m.name.charAt(0).toUpperCase()}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontWeight: 700, fontSize: 13.5, color: t.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{m.name}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 2 }}>
              <StarRating value={m.avg} count={m.ratingCount} size={12} />
              <span style={{ fontSize: 11, color: t.sub2 }}>· {m.questionsAnswered || 0} jawab</span>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

function UserPanel({ shared, profile, setProfile, reload, dark, onToggleDark }) {
  const [tab, setTab] = useState("home");
  const [activeSession, setActiveSession] = useState(null);
  const [toast, setToast] = useState(null);
  const seenRef = useRef(null);
  useEffect(() => {
    const mineAnswered = shared.questions.filter((q) => q.user === profile.name && q.status === "answered").map((q) => q.id);
    if (seenRef.current === null) {
      seenRef.current = new Set(mineAnswered);
      return;
    }
    const newlyAnswered = mineAnswered.find((id) => !seenRef.current.has(id));
    if (newlyAnswered) setToast("Aapke sawal ka jawab agaya hai — Profile mein dekhein.");
    seenRef.current = new Set(mineAnswered);
  }, [shared.questions, profile.name]);

  const refreshSession = async (id) => {
    const sessions = await getShared("sessions", []);
    const found = sessions.find((s) => s.id === id);
    if (found) setActiveSession(found);
  };

  const joinSession = async (s) => {
    const sessions = await getShared("sessions", []);
    const idx = sessions.findIndex((x) => x.id === s.id);
    if (idx !== -1) { sessions[idx].viewers = (sessions[idx].viewers || 0) + 1; await setShared("sessions", sessions); }
    setActiveSession(sessions[idx] || s);
  };

  const likeQuestion = async (id) => {
    const questions = await getShared("questions", []);
    const idx = questions.findIndex((q) => q.id === id);
    if (idx !== -1) { questions[idx].likes += 1; await setShared("questions", questions); reload(); }
  };

  const toggleBookmark = async (id) => {
    const bookmarks = profile.bookmarks.includes(id) ? profile.bookmarks.filter((b) => b !== id) : [...profile.bookmarks, id];
    const next = { ...profile, bookmarks };
    setProfile(next);
    await setPersonal("profile", next);
  };

  const rateQuestion = async (id, stars) => {
    if (profile.ratedQuestions?.includes(id)) return;
    const questions = await getShared("questions", []);
    const idx = questions.findIndex((q) => q.id === id);
    if (idx === -1) return;
    questions[idx].ratingSum = (questions[idx].ratingSum || 0) + stars;
    questions[idx].ratingCount = (questions[idx].ratingCount || 0) + 1;
    await setShared("questions", questions);
    const next = { ...profile, ratedQuestions: [...(profile.ratedQuestions || []), id] };
    setProfile(next);
    await setPersonal("profile", next);
    reload();
  };

  const upgrade = async () => {
    const next = { ...profile, premium: true };
    setProfile(next);
    await setPersonal("profile", next);
  };

  const myQuestions = shared.questions.filter((q) => q.user === profile.name);
  const bookmarkedQs = shared.questions.filter((q) => profile.bookmarks.includes(q.id));

  const notifications = [
    ...(shared.announcement ? [{ id: "ann", icon: <Megaphone size={13} />, text: shared.announcement, time: "Announcement" }] : []),
    ...shared.sessions.filter((s) => s.status === "live").slice(0, 3).map((s) => ({ id: s.id, icon: <Radio size={13} />, text: `${s.title} — abhi live hai`, time: "Live" })),
    ...myQuestions.filter((q) => q.status === "answered").sort((a, b) => b.createdAt - a.createdAt).slice(0, 5).map((q) => ({ id: q.id, icon: <CheckCircle2 size={13} />, text: `Aapke sawal "${q.question.slice(0, 40)}${q.question.length > 40 ? "…" : ""}" ka jawab mil gaya`, time: timeAgo(q.createdAt) })),
  ];

  const TABS = [
    { id: "home", label: "Home", icon: <Radio size={17} /> },
    { id: "ask", label: "Poocho", icon: <MessageCircle size={17} /> },
    { id: "munazra", label: "Munazra", icon: <Swords size={17} /> },
    { id: "ulama", label: "Ulama", icon: <Trophy size={17} /> },
    { id: "bayanaat", label: "Bayanaat", icon: <Headphones size={17} /> },
    { id: "premium", label: "Premium", icon: <Crown size={17} /> },
    { id: "profile", label: "Profile", icon: <User size={17} /> },
  ];

  return (
    <div style={{ paddingBottom: 74 }}>
      {toast && <Toast text={toast} onDone={() => setToast(null)} />}
      <div style={{ padding: "16px 16px 6px" }}>
        <TopBar title="IlmLive" icon={<BookOpenText size={18} color="#0B6E55" />} notifications={notifications} dark={dark} onToggleDark={onToggleDark} onRefresh={reload} />
        {tab === "home" && <UserHome shared={shared} onJoin={joinSession} onLike={likeQuestion} onBookmark={toggleBookmark} onRate={rateQuestion} profile={profile} onShare={shareText} />}
        {tab === "ask" && <UserAsk categories={shared.categories} currentUser={profile.name} premium={profile.premium} onSubmitted={reload} />}
        {tab === "munazra" && <UserMunazra sessions={shared.sessions} onJoin={joinSession} />}
        {tab === "ulama" && <ScholarLeaderboard shared={shared} />}
        {tab === "bayanaat" && <BayanaatTab />}
        {tab === "premium" && <UserPremium premium={profile.premium} onUpgrade={upgrade} />}
        {tab === "profile" && (
          <UserProfileWrapper profile={profile} myQuestions={myQuestions} bookmarked={bookmarkedQs} likeQuestion={likeQuestion} toggleBookmark={toggleBookmark} onRate={rateQuestion} onShare={shareText} />
        )}
      </div>

      <BottomNav tabs={TABS} tab={tab} setTab={setTab} />

      {activeSession && (
        <LiveRoom session={activeSession} refreshSession={refreshSession} onLeave={() => { setActiveSession(null); reload(); }} currentUser={profile.name} isHost={false} />
      )}
    </div>
  );
}

function ScholarPanel({ shared, profile, reload, dark, onToggleDark }) {
  const t = useTheme();
  const [tab, setTab] = useState("queue");
  const me = shared.muftis.find((m) => m.name === profile.name);
  const [activeSession, setActiveSession] = useState(null);

  const refreshSession = async (id) => {
    const sessions = await getShared("sessions", []);
    const found = sessions.find((s) => s.id === id);
    if (found) setActiveSession(found);
  };

  if (!me) {
    return <EmptyState icon={<Hourglass size={28} />} text="Registration nahi mili — please dobara register karein." />;
  }
  if (me.status === "pending") {
    return (
      <div style={{ padding: 30, textAlign: "center" }}>
        <Hourglass size={30} color="#8A6A1E" style={{ marginBottom: 10 }} />
        <p style={{ fontFamily: "'Newsreader', serif", fontSize: 17, color: t.text }}>Admin ki manzoori ka intezar</p>
        <p style={{ fontSize: 13, color: t.sub, marginTop: 6 }}>Aapki registration jama ho chuki hai. Admin approve karega to yahan Dashboard khul jayega.</p>
      </div>
    );
  }
  if (me.status === "suspended") {
    return <EmptyState icon={<Ban size={28} />} text="Aapka account suspend kar diya gaya hai. Admin se rabta karein." />;
  }

  const pending = shared.questions.filter((q) => q.status === "pending").sort((a, b) => (b.premium ? 1 : 0) - (a.premium ? 1 : 0));
  const myAnswered = shared.questions.filter((q) => q.muftiName === profile.name);
  const mySessions = shared.sessions.filter((s) => s.host === profile.name);
  const myAvg = (() => {
    const sum = myAnswered.reduce((a, q) => a + (q.ratingSum || 0), 0);
    const cnt = myAnswered.reduce((a, q) => a + (q.ratingCount || 0), 0);
    return cnt ? sum / cnt : 0;
  })();

  const answerQuestion = async (id, answerText) => {
    if (!answerText.trim()) return;
    const questions = await getShared("questions", []);
    const idx = questions.findIndex((q) => q.id === id);
    if (idx === -1) return;
    questions[idx].answer = answerText.trim();
    questions[idx].status = "answered";
    questions[idx].muftiName = profile.name;
    await setShared("questions", questions);
    const muftis = await getShared("muftis", []);
    const mIdx = muftis.findIndex((m) => m.name === profile.name);
    if (mIdx !== -1) { muftis[mIdx].questionsAnswered = (muftis[mIdx].questionsAnswered || 0) + 1; await setShared("muftis", muftis); }
    reload();
  };

  const startSession = async (title, type, opponent) => {
    if (!title.trim()) return;
    const sessions = await getShared("sessions", []);
    const s = { id: uid(), title: title.trim(), type, host: profile.name, opponent: opponent.trim(), status: "live", viewers: Math.floor(Math.random() * 12) + 3, featured: false, messages: [], createdAt: Date.now() };
    await setShared("sessions", [s, ...sessions]);
    const muftis = await getShared("muftis", []);
    const mIdx = muftis.findIndex((m) => m.name === profile.name);
    if (mIdx !== -1) { muftis[mIdx].sessionsHosted = (muftis[mIdx].sessionsHosted || 0) + 1; await setShared("muftis", muftis); }
    reload();
    setActiveSession(s);
  };

  const notifications = [
    { id: "pend", icon: <Hourglass size={13} />, text: `${pending.length} sawal jawab ke muntazir hain`, time: "Queue" },
    ...(shared.announcement ? [{ id: "ann", icon: <Megaphone size={13} />, text: shared.announcement, time: "Admin" }] : []),
  ];

  const TABS = [
    { id: "queue", label: "Sawalaat" },
    { id: "upload", label: "Masla Upload" },
    { id: "live", label: "Live Karein" },
    { id: "stats", label: "Mera Record" },
  ];

  return (
    <div style={{ padding: "16px 16px 40px" }}>
      <TopBar title="Aalim Panel" icon={<BadgeCheck size={18} color="#8A6A1E" />} notifications={notifications} dark={dark} onToggleDark={onToggleDark} onRefresh={reload} tone="gold" />
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div>
          <div style={{ fontFamily: "'Newsreader', serif", fontSize: 18, color: t.text }}>Assalamualaikum, {profile.name}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4 }}>
            <Badge tone="gold"><BadgeCheck size={11} /> Approved Scholar</Badge>
            {myAvg > 0 && <StarRating value={myAvg} size={12} />}
          </div>
        </div>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 16, overflowX: "auto" }}>
        {TABS.map((tb) => (
          <button key={tb.id} onClick={() => setTab(tb.id)} style={{ padding: "8px 12px", borderRadius: 999, fontSize: 12.5, fontWeight: 700, whiteSpace: "nowrap", cursor: "pointer", border: tab === tb.id ? "1.5px solid #8A6A1E" : `1px solid ${t.border}`, background: tab === tb.id ? "#F8EFD9" : t.surface, color: tab === tb.id ? "#8A6A1E" : t.sub }}>{tb.label}</button>
        ))}
      </div>

      {tab === "queue" && (
        <div>
          {pending.length === 0 && <EmptyState icon={<MessageCircle size={26} />} text="Koi pending sawal nahi." />}
          {pending.map((q) => <AnswerRow key={q.id} q={q} onAnswer={answerQuestion} />)}
        </div>
      )}

      {tab === "upload" && <UploadMasla categories={shared.categories} muftiName={profile.name} onDone={reload} />}

      {tab === "live" && <StartLive onStart={startSession} />}

      {tab === "stats" && (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
            <StatBox label="Masail Jawab Diye" value={me.questionsAnswered || 0} />
            <StatBox label="Live Sessions" value={me.sessionsHosted || 0} />
          </div>
          <SectionTitle text="Mere Jawab Diye Hue Masail" />
          {myAnswered.length === 0 && <p style={{ fontSize: 13, color: t.sub }}>Abhi tak koi jawab nahi diya.</p>}
          {myAnswered.map((q) => <QuestionCard key={q.id} q={q} />)}
          <SectionTitle text="Meri Sessions" style={{ marginTop: 16 }} />
          {mySessions.map((s) => <SessionRow key={s.id} s={s} ended={s.status === "ended"} disabled={s.status !== "live"} onJoin={() => setActiveSession(s)} />)}
        </div>
      )}

      {activeSession && (
        <LiveRoom session={activeSession} refreshSession={refreshSession} onLeave={() => { setActiveSession(null); reload(); }} currentUser={profile.name} isHost />
      )}
    </div>
  );
}

/* ============================== Admin panel ============================== */

function BarRow({ label, value, max, color = "#0B6E55" }) {
  const t = useTheme();
  const pct = max > 0 ? Math.max(4, Math.round((value / max) * 100)) : 0;
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: t.text, marginBottom: 4 }}>
        <span>{label}</span><span style={{ fontWeight: 700 }}>{value}</span>
      </div>
      <div style={{ height: 8, background: t.surface3, borderRadius: 999, overflow: "hidden" }}>
        <div className="bar-grow" style={{ height: "100%", width: `${pct}%`, background: color, borderRadius: 999 }} />
      </div>
    </div>
  );
}

function AdminPanel({ shared, reload, dark, onToggleDark }) {
  const t = useTheme();
  const [tab, setTab] = useState("dashboard");
  const [announcementText, setAnnouncementText] = useState(shared.announcement || "");
  const [newCategory, setNewCategory] = useState("");

  const approveMufti = async (id, status) => {
    const muftis = await getShared("muftis", []);
    const idx = muftis.findIndex((m) => m.id === id);
    if (idx !== -1) { muftis[idx].status = status; await setShared("muftis", muftis); reload(); }
  };

  const removeQuestion = async (id) => {
    const questions = await getShared("questions", []);
    await setShared("questions", questions.filter((q) => q.id !== id));
    reload();
  };

  const forceEndSession = async (id) => {
    const sessions = await getShared("sessions", []);
    const idx = sessions.findIndex((s) => s.id === id);
    if (idx !== -1) { sessions[idx].status = "ended"; await setShared("sessions", sessions); reload(); }
  };

  const featureSession = async (id) => {
    const sessions = await getShared("sessions", []);
    const idx = sessions.findIndex((s) => s.id === id);
    if (idx !== -1) { sessions[idx].featured = !sessions[idx].featured; await setShared("sessions", sessions); reload(); }
  };

  const saveAnnouncement = async () => { await setShared("announcement", announcementText); reload(); };

  const addCategory = async () => {
    if (!newCategory.trim()) return;
    const cats = [...shared.categories, newCategory.trim()];
    await setShared("categories", cats);
    setNewCategory("");
    reload();
  };
  const removeCategory = async (c) => { await setShared("categories", shared.categories.filter((x) => x !== c)); reload(); };

  const exportData = () => {
    const blob = new Blob([JSON.stringify(shared, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `ilmlive-export-${Date.now()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };

  const uniqueAskers = new Set(shared.questions.map((q) => q.user)).size;
  const catCounts = shared.categories.map((c) => ({ c, n: shared.questions.filter((q) => q.category === c).length }));
  const maxCatCount = Math.max(1, ...catCounts.map((x) => x.n));
  const approvedMuftis = shared.muftis.filter((m) => m.status === "approved");
  const topMuftis = approvedMuftis.map((m) => {
    const qs = shared.questions.filter((q) => q.muftiName === m.name && q.status === "answered");
    const sum = qs.reduce((a, q) => a + (q.ratingSum || 0), 0);
    const cnt = qs.reduce((a, q) => a + (q.ratingCount || 0), 0);
    return { ...m, avg: cnt ? sum / cnt : 0 };
  }).sort((a, b) => (b.questionsAnswered || 0) - (a.questionsAnswered || 0)).slice(0, 5);
  const maxAnswered = Math.max(1, ...topMuftis.map((m) => m.questionsAnswered || 0));

  const notifications = [
    { id: "pend-m", icon: <Users size={13} />, text: `${shared.muftis.filter((m) => m.status === "pending").length} mufti manzoori ke muntazir`, time: "Muftis" },
    { id: "pend-q", icon: <Hourglass size={13} />, text: `${shared.questions.filter((q) => q.status === "pending").length} sawal pending hain`, time: "Moderation" },
    { id: "live", icon: <Radio size={13} />, text: `${shared.sessions.filter((s) => s.status === "live").length} sessions is waqt live hain`, time: "Sessions" },
  ];

  const TABS = [
    { id: "dashboard", label: "Dashboard" },
    { id: "analytics", label: "Analytics" },
    { id: "muftis", label: "Muftis" },
    { id: "moderation", label: "Moderation" },
    { id: "sessions", label: "Live Sessions" },
    { id: "settings", label: "Settings" },
  ];

  return (
    <div style={{ padding: "16px 16px 40px" }}>
      <TopBar title="Admin Panel" icon={<ShieldCheck size={18} color="#5B3F91" />} notifications={notifications} dark={dark} onToggleDark={onToggleDark} onRefresh={reload} tone="purple" />
      <p style={{ fontSize: 12.5, color: t.sub, marginBottom: 16, marginTop: -8 }}>Poora management system yahan se control hota hai.</p>

      <div style={{ display: "flex", gap: 6, marginBottom: 16, overflowX: "auto" }}>
        {TABS.map((tb) => (
          <button key={tb.id} onClick={() => setTab(tb.id)} style={{ padding: "8px 12px", borderRadius: 999, fontSize: 12.5, fontWeight: 700, whiteSpace: "nowrap", cursor: "pointer", border: tab === tb.id ? "1.5px solid #5B3F91" : `1px solid ${t.border}`, background: tab === tb.id ? "#EFEAF8" : t.surface, color: tab === tb.id ? "#5B3F91" : t.sub }}>{tb.label}</button>
        ))}
      </div>

      {tab === "dashboard" && (
        <div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <StatBox label="KUL SAWALAAT" value={shared.questions.length} />
            <StatBox label="JAWAB DIYE GAYE" value={shared.questions.filter((q) => q.status === "answered").length} />
            <StatBox label="ACTIVE USERS" value={uniqueAskers} />
            <StatBox label="MUFTI (APPROVED)" value={shared.muftis.filter((m) => m.status === "approved").length} />
            <StatBox label="PENDING APPROVAL" value={shared.muftis.filter((m) => m.status === "pending").length} />
            <StatBox label="LIVE SESSIONS" value={shared.sessions.filter((s) => s.status === "live").length} />
          </div>
          <GhostButton onClick={exportData} icon={<Download size={13} />} style={{ marginTop: 14, width: "100%", justifyContent: "center" }}>Data Export Karein (.json)</GhostButton>
        </div>
      )}

      {tab === "analytics" && (
        <div>
          <SectionTitle icon={<BarChart3 size={15} />} text="Category ke Hisaab se Sawalaat" />
          <div style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 12, padding: 14, marginBottom: 18 }}>
            {catCounts.length === 0 && <p style={{ fontSize: 12.5, color: t.sub }}>Koi category nahi.</p>}
            {catCounts.map((x) => <BarRow key={x.c} label={x.c} value={x.n} max={maxCatCount} />)}
          </div>
          <SectionTitle icon={<Award size={15} />} text="Behtareen Ulama (Jawab ke Hisaab se)" />
          <div style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 12, padding: 14 }}>
            {topMuftis.length === 0 && <p style={{ fontSize: 12.5, color: t.sub }}>Abhi koi approved mufti nahi.</p>}
            {topMuftis.map((m) => <BarRow key={m.id} label={m.name} value={m.questionsAnswered || 0} max={maxAnswered} color="#8A6A1E" />)}
          </div>
        </div>
      )}

      {tab === "muftis" && (
        <div>
          {shared.muftis.length === 0 && <EmptyState icon={<Users size={26} />} text="Abhi tak koi mufti registration nahi hui." />}
          {shared.muftis.map((m) => (
            <div key={m.id} style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 12, padding: 14, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14.5, color: t.text }}>{m.name}</div>
                  <div style={{ fontSize: 12, color: t.sub, marginTop: 2 }}>{m.bio || "Koi bio nahi"}</div>
                </div>
                <Badge tone={m.status === "approved" ? "brand" : m.status === "pending" ? "grey" : "red"}>{m.status}</Badge>
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                {m.status !== "approved" && <GhostButton onClick={() => approveMufti(m.id, "approved")} icon={<CheckCircle2 size={13} />}>Manzoor</GhostButton>}
                {m.status !== "suspended" && <GhostButton onClick={() => approveMufti(m.id, "suspended")} icon={<Ban size={13} />}>Suspend</GhostButton>}
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === "moderation" && (
        <div>
          {shared.questions.length === 0 && <EmptyState icon={<Flag size={26} />} text="Koi content nahi." />}
          {shared.questions.map((q) => (
            <div key={q.id} style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 12, padding: 12, marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 13, color: t.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{q.question}</div>
                <div style={{ fontSize: 11, color: t.sub2 }}>{q.user} · {q.status}</div>
              </div>
              <button onClick={() => removeQuestion(q.id)} style={{ background: "none", border: "none", color: "#B03434", cursor: "pointer", flexShrink: 0 }}><Trash2 size={16} /></button>
            </div>
          ))}
        </div>
      )}

      {tab === "sessions" && (
        <div>
          {shared.sessions.length === 0 && <EmptyState icon={<Radio size={26} />} text="Koi session nahi." />}
          {shared.sessions.map((s) => (
            <div key={s.id} style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 12, padding: 12, marginBottom: 8 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 13.5, color: t.text }}>{s.title}</div>
                  <div style={{ fontSize: 11.5, color: t.sub }}>{s.host} · {s.status}</div>
                </div>
                {s.status === "live" && <LivePulse />}
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                {s.status === "live" && <GhostButton onClick={() => forceEndSession(s.id)} icon={<Square size={12} />}>Khatam Karein</GhostButton>}
                <GhostButton onClick={() => featureSession(s.id)} icon={<Star size={12} />}>{s.featured ? "Unfeature" : "Feature"}</GhostButton>
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === "settings" && (
        <div>
          <SectionTitle icon={<Megaphone size={15} />} text="Global Announcement" />
          <textarea value={announcementText} onChange={(e) => setAnnouncementText(e.target.value)} placeholder="Sab users ko dikhne wala paigham…" style={{ ...inputStyleFor(t), minHeight: 70, marginBottom: 8 }} />
          <PrimaryButton onClick={saveAnnouncement}>Save Karein</PrimaryButton>

          <SectionTitle icon={<Tag size={15} />} text="Categories" style={{ marginTop: 24 }} />
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
            {shared.categories.map((c) => (
              <span key={c} style={{ display: "inline-flex", alignItems: "center", gap: 4, background: t.surface3, borderRadius: 999, padding: "5px 10px", fontSize: 12.5, color: t.text }}>
                {c} <button onClick={() => removeCategory(c)} style={{ background: "none", border: "none", cursor: "pointer", color: "#B03434", display: "flex" }}><XCircle size={13} /></button>
              </span>
            ))}
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <input value={newCategory} onChange={(e) => setNewCategory(e.target.value)} placeholder="Nayi category" style={{ ...inputStyleFor(t), flex: 1 }} />
            <PrimaryButton onClick={addCategory}>+ Add</PrimaryButton>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================== App root ============================== */

export default function App() {
  const [booted, setBooted] = useState(false);
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [shared, setShared] = useState({ questions: [], sessions: [], muftis: [], categories: DEFAULT_CATEGORIES, announcement: "" });
  const [loading, setLoading] = useState(true);
  const [dark, setDark] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => setBooted(true), 1300);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    (async () => {
      const pref = await getPersonal("darkMode", false);
      setDark(!!pref);
    })();
  }, []);

  const toggleDark = async () => {
    setDark((d) => {
      const next = !d;
      setPersonal("darkMode", next);
      return next;
    });
  };

  const reload = useCallback(async () => {
    const [questions, sessions, muftis, categories, announcement] = await Promise.all([
      getShared("questions", []),
      getShared("sessions", []),
      getShared("muftis", []),
      getShared("categories", DEFAULT_CATEGORIES),
      getShared("announcement", ""),
    ]);
    setShared({ questions, sessions, muftis, categories, announcement });
  }, []);

  useEffect(() => {
    if (!session) return;
    (async () => { setLoading(true); await reload(); setLoading(false); })();
    const t = setInterval(reload, 6000);
    return () => clearInterval(t);
  }, [session, reload]);

  const enter = async (data) => {
    if (data.role === "scholar") {
      const muftis = await getShared("muftis", []);
      let existing = muftis.find((m) => m.name === data.name);
      if (!existing) {
        existing = { id: uid(), name: data.name, bio: data.bio, status: "pending", questionsAnswered: 0, sessionsHosted: 0 };
        await setShared("muftis", [...muftis, existing]);
      }
    }
    const prof = await getPersonal("profile", { name: data.name, premium: false, bookmarks: [], ratedQuestions: [] });
    prof.name = data.name;
    if (!prof.ratedQuestions) prof.ratedQuestions = [];
    await setPersonal("profile", prof);
    setProfile(prof);
    setSession(data);
  };

  const logout = () => { setSession(null); setProfile(null); };

  const theme = dark ? DARK : LIGHT;

  if (!booted) return <SplashScreen />;
  if (!session) return <LoginScreen onEnter={enter} />;

  return (
    <ThemeCtx.Provider value={theme}>
      <div style={{ minHeight: "100vh", background: theme.bg, fontFamily: "'Poppins', sans-serif", transition: "background .2s ease" }}>
        {!loading && session.role === "user" && profile && <UserPanel shared={shared} profile={profile} setProfile={setProfile} reload={reload} dark={dark} onToggleDark={toggleDark} />}
        {!loading && session.role === "scholar" && profile && (
          <div>
            <ScholarPanel shared={shared} profile={profile} reload={reload} dark={dark} onToggleDark={toggleDark} />
            <div style={{ padding: "0 16px 20px" }}><GhostButton onClick={logout} icon={<LogOut size={14} />}>Role Badlein</GhostButton></div>
          </div>
        )}
        {!loading && session.role === "admin" && (
          <div>
            <AdminPanel shared={shared} reload={reload} dark={dark} onToggleDark={toggleDark} />
            <div style={{ padding: "0 16px 20px" }}><GhostButton onClick={logout} icon={<LogOut size={14} />}>Logout</GhostButton></div>
          </div>
        )}
        {loading && (
          <div style={{ padding: 16 }}>
            <Skeleton /><Skeleton /><Skeleton />
          </div>
        )}
      </div>
    </ThemeCtx.Provider>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
